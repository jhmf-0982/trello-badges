<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Badges Interfood</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
/* ==========================================================================
   Badges Interfood - versao heartbeat

   Este Power-Up nao desenha nada. Ele apenas registra um badge que pede ao
   Trello pra ser reconsultado a cada X segundos, na esperanca de que esse
   ciclo force o card front a repintar e os badges NATIVOS dos campos
   personalizados atualizem sozinhos.

   Se nao funcionar, os cards ficam exatamente como estao hoje: nada quebra,
   nada muda de aparencia.
   ========================================================================== */

var INTERVALO = 10; // segundos. O minimo aceito pelo Trello e 10.

TrelloPowerUp.initialize({

  'card-badges': function (t) {
    // Le os campos do card sem usar o resultado. A leitura existe pra
    // manter o Power-Up consultando a API a cada ciclo, em vez de ficar
    // devolvendo uma resposta em cache.
    return t.card('customFieldItems')
      .then(function () {
        return [{ text: '', refresh: INTERVALO }];
      })
      .catch(function () {
        return [{ text: '', refresh: INTERVALO }];
      });
  }

});
</script>
</body>
</html>
