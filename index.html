<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Badges Interfood</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
/* ==========================================================================
   Badges Interfood - conector

   Mantem os badges de campo personalizado atualizados na frente dos cards.
   Os badges nativos do Trello nao redesenham quando uma automacao muda o
   campo; estes redesenham sozinhos no intervalo configurado.

   Este arquivo NAO precisa ser editado. Toda a configuracao e feita pela
   tela de configuracao dentro do Trello.
   ========================================================================== */

var INTERVALO_PADRAO = 10;

// Cores sugeridas enquanto o Power-Up nunca foi configurado. Depois da
// primeira vez que voce salvar, isto deixa de ser usado.
var CORES_SUGERIDAS = {
  'Correção': 'red',
  'Revisão': 'orange',
  'Aprovação': 'green',
  'Publicação': 'sky',
  'Distribuição': 'purple',
  'Criação': 'blue',
  'Upload': 'yellow',
  'Legenda': 'pink',
  'Urgente': 'red'
};

// Le o valor de um item de campo personalizado, cobrindo os tipos que o
// Trello suporta: lista, texto, numero, data e checkbox.
// Devolve { texto, idOpcao, marcado } ou null quando o campo esta vazio.
function lerValor(item, definicao) {
  if (!item) return null;

  if (item.idValue) {
    var opcoes = (definicao && definicao.options) || [];
    for (var i = 0; i < opcoes.length; i++) {
      if (opcoes[i].id === item.idValue) {
        return {
          texto: opcoes[i].value ? opcoes[i].value.text : null,
          idOpcao: opcoes[i].id,
          marcado: false
        };
      }
    }
    return null;
  }

  var v = item.value;
  if (!v) return null;

  // O Power-Up do Trello devolve todos os campos do value preenchidos
  // (checked, date, number, text), a maioria com null. Precisamos achar
  // o que nao e null. A ordem importa: checked so conta quando e "true"
  // (string ou boolean), nao quando e null.

  if (v.checked === true || v.checked === 'true') {
    return { texto: null, idOpcao: null, marcado: true };
  }
  if (v.text !== null && v.text !== undefined && v.text !== '') {
    return { texto: v.text, idOpcao: null, marcado: false };
  }
  if (v.number !== null && v.number !== undefined) {
    return { texto: String(v.number), idOpcao: null, marcado: false };
  }
  if (v.date !== null && v.date !== undefined) {
    var d;
    try { d = new Date(v.date).toLocaleDateString('pt-BR'); } catch (e) { d = String(v.date); }
    return { texto: d, idOpcao: null, marcado: false };
  }
  return null;
}

// Decide se o nome do campo entra antes do valor ("Etapa: Aprovação").
// Em checkbox nao entra por padrao, senao viraria "Pendência: Pendência".
function usarNome(cfg, definicao) {
  if (cfg && typeof cfg.comNome === 'boolean') return cfg.comNome;
  return definicao.type !== 'checkbox';
}

function montarBadges(definicoes, itens, config) {
  definicoes = definicoes || [];
  itens = itens || [];
  config = config || {};

  var semConfig = !config.campos;
  var cfgCampos = config.campos || {};
  var intervalo = config.intervalo || INTERVALO_PADRAO;

  var badges = [];

  definicoes.forEach(function (definicao) {
    if (!definicao || !definicao.id) return;

    var cfg = cfgCampos[definicao.id];

    // Sem configuracao salva, mostra todos os campos.
    // Com configuracao salva, mostra so os que estao marcados.
    if (semConfig) cfg = { on: true };
    else if (!cfg || !cfg.on) return;

    var item = null;
    for (var i = 0; i < itens.length; i++) {
      if (itens[i].idCustomField === definicao.id) { item = itens[i]; break; }
    }

    var lido = lerValor(item, definicao);
    if (!lido) return;

    var valor;
    if (lido.marcado) {
      valor = cfg.textoMarcado || definicao.name;
    } else {
      if (!lido.texto) return;
      // Opcao desmarcada na configuracao nao gera badge.
      if (lido.idOpcao && cfg.opcoes && cfg.opcoes[lido.idOpcao] &&
          cfg.opcoes[lido.idOpcao].on === false) {
        return;
      }
      valor = lido.texto;
    }

    // A cor e escolhida pelo valor cru, nao pelo texto ja montado.
    var cor = cfg.cor || null;
    if (lido.idOpcao && cfg.opcoes && cfg.opcoes[lido.idOpcao] && cfg.opcoes[lido.idOpcao].cor) {
      cor = cfg.opcoes[lido.idOpcao].cor;
    }
    if (!cor && CORES_SUGERIDAS[valor]) cor = CORES_SUGERIDAS[valor];

    var texto = (usarNome(cfg, definicao) && !lido.marcado)
      ? definicao.name + ': ' + valor
      : valor;

    var badge = { text: texto, refresh: intervalo };
    // Cor so vai no objeto se existir. Mandar um valor invalido faz o
    // Trello ignorar o badge inteiro.
    if (cor) badge.color = cor;

    badges.push({ badge: badge, nome: definicao.name, valor: valor, cor: cor, intervalo: intervalo });
  });

  return badges;
}

function carregar(t) {
  return Promise.all([
    t.board('customFields'),
    t.card('customFieldItems'),
    t.get('board', 'shared', 'config')
  ]).then(function (res) {
    var board = res[0] || {};
    var card = res[1] || {};
    return montarBadges(board.customFields, card.customFieldItems, res[2]);
  });
}

TrelloPowerUp.initialize({

  // Badges na frente do card, na visao do board.
  'card-badges': function (t) {
    return carregar(t).then(function (lista) {
      return lista.map(function (x) { return x.badge; });
    }).catch(function () { return []; });
  },

  // Badges dentro do card aberto. Aqui o Trello ja mostra um titulo ao lado,
  // entao o nome do campo vai no titulo e o valor sozinho no texto.
  'card-detail-badges': function (t) {
    return carregar(t).then(function (lista) {
      return lista.map(function (x) {
        var b = { title: x.nome, text: x.valor, refresh: x.intervalo };
        if (x.cor) b.color = x.cor;
        return b;
      });
    }).catch(function () { return []; });
  },

  'show-settings': function (t) {
    return t.popup({
      title: 'Configurar badges',
      url: t.signUrl('./settings.html'),
      height: 420
    });
  }

});
</script>
</body>
</html>
