<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Badges Interfood</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
/* ========================================================================== 
   Badges Interfood - conector

   Mantem os badges de campo personalizado atualizados na frente dos cards.
   Cada badge e dinamico: o Trello chama novamente a funcao do badge a cada
   10 segundos, e o Power-Up rele os customFieldItems atuais do card.

   Este arquivo NAO precisa ser editado. Toda a configuracao e feita pela
   tela de configuracao dentro do Trello.
   ========================================================================== */

var INTERVALO_BADGES = 10;

// Cores sugeridas enquanto o Power-Up nunca foi configurado. Depois da
// primeira vez que voce salvar, isto deixa de ser usado.
var CORES_SUGERIDAS = {
  'Correção': 'red',
  'Revisão': 'orange',
  'Aprovação': 'green',
  'Publicação': 'sky',
  'Distribuição': 'purple',
  'Criação': 'blue',
  'Upload': 'yellow',
  'Legenda': 'pink',
  'Urgente': 'red'
};

// Le o valor de um item de campo personalizado, cobrindo os tipos que o
// Trello suporta: lista, texto, numero, data e checkbox.
// Devolve { texto, idOpcao, marcado } ou null quando o campo esta vazio.
function lerValor(item, definicao) {
  if (!item) return null;

  if (item.idValue) {
    var opcoes = (definicao && definicao.options) || [];
    for (var i = 0; i < opcoes.length; i++) {
      if (opcoes[i].id === item.idValue) {
        return {
          texto: opcoes[i].value ? opcoes[i].value.text : null,
          idOpcao: opcoes[i].id,
          marcado: false
        };
      }
    }
    return null;
  }

  var v = item.value;
  if (!v) return null;

  // O Power-Up do Trello devolve todos os campos do value preenchidos
  // (checked, date, number, text), a maioria com null. Precisamos achar
  // o que nao e null. A ordem importa: checked so conta quando e "true"
  // (string ou boolean), nao quando e null.
  if (v.checked === true || v.checked === 'true') {
    return { texto: null, idOpcao: null, marcado: true };
  }
  if (v.text !== null && v.text !== undefined && v.text !== '') {
    return { texto: v.text, idOpcao: null, marcado: false };
  }
  if (v.number !== null && v.number !== undefined) {
    return { texto: String(v.number), idOpcao: null, marcado: false };
  }
  if (v.date !== null && v.date !== undefined) {
    var d;
    try { d = new Date(v.date).toLocaleDateString('pt-BR'); } catch (e) { d = String(v.date); }
    return { texto: d, idOpcao: null, marcado: false };
  }
  return null;
}

// Decide se o nome do campo entra antes do valor ("Etapa: Aprovação").
// Em checkbox nao entra por padrao, senao viraria "Pendência: Pendência".
function usarNome(cfg, definicao) {
  if (cfg && typeof cfg.comNome === 'boolean') return cfg.comNome;
  return definicao.type !== 'checkbox';
}

// Monta os dados de um unico campo. Retorna null quando o campo deve ficar
// oculto ou esta sem valor.
function montarCampo(definicao, itens, config) {
  itens = itens || [];
  config = config || {};

  var semConfig = !config.campos;
  var cfgCampos = config.campos || {};
  var cfg = cfgCampos[definicao.id];

  // Sem configuracao salva, mostra todos os campos.
  // Com configuracao salva, mostra so os que estao marcados.
  if (semConfig) cfg = { on: true };
  else if (!cfg || !cfg.on) return null;

  var item = null;
  for (var i = 0; i < itens.length; i++) {
    if (itens[i].idCustomField === definicao.id) {
      item = itens[i];
      break;
    }
  }

  var lido = lerValor(item, definicao);
  if (!lido) return null;

  var valor;
  if (lido.marcado) {
    valor = cfg.textoMarcado || definicao.name;
  } else {
    if (!lido.texto) return null;

    // Opcao desmarcada na configuracao nao gera badge.
    if (lido.idOpcao && cfg.opcoes && cfg.opcoes[lido.idOpcao] &&
        cfg.opcoes[lido.idOpcao].on === false) {
      return null;
    }
    valor = lido.texto;
  }

  // A cor e escolhida pelo valor cru, nao pelo texto ja montado.
  var cor = cfg.cor || null;
  if (lido.idOpcao && cfg.opcoes && cfg.opcoes[lido.idOpcao] && cfg.opcoes[lido.idOpcao].cor) {
    cor = cfg.opcoes[lido.idOpcao].cor;
  }
  if (!cor && CORES_SUGERIDAS[valor]) cor = CORES_SUGERIDAS[valor];

  // Compatibilidade com configuracoes antigas: black nao e uma cor valida
  // para card-badges do Power-Up. Usa light-gray no lugar.
  if (cor === 'black') cor = 'light-gray';

  var texto = (usarNome(cfg, definicao) && !lido.marcado)
    ? definicao.name + ': ' + valor
    : valor;

  return {
    nome: definicao.name,
    valor: valor,
    cor: cor,
    texto: texto
  };
}

// O resultado dinamico precisa conter refresh. O objeto externo contem apenas
// a funcao dynamic, conforme a API oficial do Trello.
function badgeVazio() {
  // Sem text/icon o Trello nao desenha conteudo visivel, mas mantem o
  // refresh do badge dinamico ativo para detectar quando o campo ganhar valor.
  return { refresh: INTERVALO_BADGES };
}

// Rele o valor atual do card em CADA ciclo dinamico. A configuracao tambem e
// relida para que alteracoes na tela de settings se propaguem sem depender de
// uma recarga completa do board.
function carregarCampoAtual(t, definicao) {
  return Promise.all([
    t.card('customFieldItems'),
    t.get('board', 'shared', 'config')
  ]).then(function (res) {
    var card = res[0] || {};
    return montarCampo(definicao, card.customFieldItems, res[1]);
  });
}

function criarBadgeFrente(t, definicao) {
  return {
    dynamic: function () {
      return carregarCampoAtual(t, definicao).then(function (campo) {
        if (!campo) return badgeVazio();

        var badge = {
          text: campo.texto,
          refresh: INTERVALO_BADGES
        };
        if (campo.cor) badge.color = campo.cor;
        return badge;
      }).catch(function () {
        // Mantem o ciclo vivo mesmo se uma leitura pontual falhar.
        return badgeVazio();
      });
    }
  };
}

function criarBadgeDetalhe(t, definicao) {
  return {
    dynamic: function () {
      return carregarCampoAtual(t, definicao).then(function (campo) {
        if (!campo) return badgeVazio();

        var badge = {
          title: campo.nome,
          text: campo.valor,
          refresh: INTERVALO_BADGES
        };
        if (campo.cor) badge.color = campo.cor;
        return badge;
      }).catch(function () {
        return badgeVazio();
      });
    }
  };
}

// O conjunto de custom fields e carregado uma vez para criar um slot dinamico
// para cada campo habilitado na configuracao. O valor de cada campo e relido
// a cada 10 segundos. Campos habilitados mas vazios mantem um slot invisivel,
// o que permite que aparecam assim que ganharem valor.
function carregarDefinicoes(t) {
  return Promise.all([
    t.board('customFields'),
    t.get('board', 'shared', 'config')
  ]).then(function (res) {
    var board = res[0] || {};
    var definicoes = board.customFields || [];
    var config = res[1] || {};

    if (!config.campos) return definicoes;

    return definicoes.filter(function (definicao) {
      var cfg = config.campos[definicao.id];
      return !!(cfg && cfg.on);
    });
  });
}

TrelloPowerUp.initialize({

  // Badges na frente do card, na visao do board.
  'card-badges': function (t) {
    return carregarDefinicoes(t).then(function (definicoes) {
      return definicoes.map(function (definicao) {
        return criarBadgeFrente(t, definicao);
      });
    }).catch(function () {
      return [];
    });
  },

  // Badges dentro do card aberto.
  'card-detail-badges': function (t) {
    return carregarDefinicoes(t).then(function (definicoes) {
      return definicoes.map(function (definicao) {
        return criarBadgeDetalhe(t, definicao);
      });
    }).catch(function () {
      return [];
    });
  },

  'show-settings': function (t) {
    return t.popup({
      title: 'Configurar badges',
      url: t.signUrl('./settings.html'),
      height: 220
    });
  }

});
</script>
</body>
</html>
