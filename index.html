<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Badges Interfood</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
/* ========================================================================== 
   Badges Interfood - conector

   Os badges sao dinamicos e atualizam a cada 10 segundos.
   Quando o membro autoriza a leitura pela REST API, os valores dos Custom
   Fields sao buscados diretamente do servidor do Trello, evitando o cache
   desatualizado de t.card('customFieldItems').

   Sem autorizacao, o Power-Up continua funcionando com a leitura nativa como
   fallback, mantendo o comportamento anterior.
   ========================================================================== */

var INTERVALO_BADGES = 10;
var CACHE_REST_MS = 8500;
var cacheBoard = {
  idBoard: null,
  timestamp: 0,
  promise: null,
  cards: null
};

// Cores sugeridas enquanto o Power-Up nunca foi configurado.
var CORES_SUGERIDAS = {
  'Correção': 'red',
  'Revisão': 'orange',
  'Aprovação': 'green',
  'Publicação': 'sky',
  'Distribuição': 'purple',
  'Criação': 'blue',
  'Upload': 'yellow',
  'Legenda': 'pink',
  'Urgente': 'red'
};

function lerValor(item, definicao) {
  if (!item) return null;

  if (item.idValue) {
    var opcoes = (definicao && definicao.options) || [];
    for (var i = 0; i < opcoes.length; i++) {
      if (opcoes[i].id === item.idValue) {
        return {
          texto: opcoes[i].value ? opcoes[i].value.text : null,
          idOpcao: opcoes[i].id,
          marcado: false
        };
      }
    }
    return null;
  }

  var v = item.value;
  if (!v) return null;

  if (v.checked === true || v.checked === 'true') {
    return { texto: null, idOpcao: null, marcado: true };
  }
  if (v.text !== null && v.text !== undefined && v.text !== '') {
    return { texto: v.text, idOpcao: null, marcado: false };
  }
  if (v.number !== null && v.number !== undefined) {
    return { texto: String(v.number), idOpcao: null, marcado: false };
  }
  if (v.date !== null && v.date !== undefined) {
    var d;
    try { d = new Date(v.date).toLocaleDateString('pt-BR'); }
    catch (e) { d = String(v.date); }
    return { texto: d, idOpcao: null, marcado: false };
  }
  return null;
}

function usarNome(cfg, definicao) {
  if (cfg && typeof cfg.comNome === 'boolean') return cfg.comNome;
  return definicao.type !== 'checkbox';
}

function montarCampo(definicao, itens, config) {
  itens = itens || [];
  config = config || {};

  var semConfig = !config.campos;
  var cfgCampos = config.campos || {};
  var cfg = cfgCampos[definicao.id];

  if (semConfig) cfg = { on: true };
  else if (!cfg || !cfg.on) return null;

  var item = null;
  for (var i = 0; i < itens.length; i++) {
    if (itens[i].idCustomField === definicao.id) {
      item = itens[i];
      break;
    }
  }

  var lido = lerValor(item, definicao);
  if (!lido) return null;

  var valor;
  if (lido.marcado) {
    valor = cfg.textoMarcado || definicao.name;
  } else {
    if (!lido.texto) return null;

    if (lido.idOpcao && cfg.opcoes && cfg.opcoes[lido.idOpcao] &&
        cfg.opcoes[lido.idOpcao].on === false) {
      return null;
    }
    valor = lido.texto;
  }

  var cor = cfg.cor || null;
  if (lido.idOpcao && cfg.opcoes && cfg.opcoes[lido.idOpcao] && cfg.opcoes[lido.idOpcao].cor) {
    cor = cfg.opcoes[lido.idOpcao].cor;
  }
  if (!cor && CORES_SUGERIDAS[valor]) cor = CORES_SUGERIDAS[valor];
  if (cor === 'black') cor = 'light-gray';

  var texto = (usarNome(cfg, definicao) && !lido.marcado)
    ? definicao.name + ': ' + valor
    : valor;

  return {
    nome: definicao.name,
    valor: valor,
    cor: cor,
    texto: texto
  };
}

function badgeVazio() {
  return { refresh: INTERVALO_BADGES };
}

function criarBadgeDiagnostico() {
  return {
    dynamic: function () {
      var agora = new Date();
      var horario = agora.toLocaleTimeString('pt-BR', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
      return {
        text: 'TESTE ' + horario,
        color: 'blue',
        refresh: INTERVALO_BADGES
      };
    }
  };
}

function normalizarToken(token) {
  if (!token) return null;
  token = String(token);

  // t.authorize pode devolver apenas o token ou o fragmento #token=...
  if (token.charAt(0) === '#') {
    var params = new URLSearchParams(token.slice(1));
    return params.get('token') || null;
  }
  if (token.indexOf('token=') === 0) {
    var params2 = new URLSearchParams(token);
    return params2.get('token') || null;
  }
  return token;
}

function limparCacheRest() {
  cacheBoard.idBoard = null;
  cacheBoard.timestamp = 0;
  cacheBoard.promise = null;
  cacheBoard.cards = null;
}

function buscarBoardViaRest(t) {
  var agora = Date.now();

  return Promise.all([
    t.board('id'),
    t.get('board', 'shared', 'trelloApiKey'),
    t.get('member', 'private', 'trelloReadToken')
  ]).then(function (res) {
    var board = res[0] || {};
    var idBoard = board.id;
    var apiKey = res[1];
    var token = normalizarToken(res[2]);

    if (!idBoard || !apiKey || !token) return null;

    if (cacheBoard.idBoard === idBoard && cacheBoard.cards &&
        (agora - cacheBoard.timestamp) < CACHE_REST_MS) {
      return cacheBoard.cards;
    }

    if (cacheBoard.idBoard === idBoard && cacheBoard.promise &&
        (agora - cacheBoard.timestamp) < CACHE_REST_MS) {
      return cacheBoard.promise;
    }

    var url = 'https://api.trello.com/1/boards/' + encodeURIComponent(idBoard) +
      '/cards?fields=id&customFieldItems=true&key=' + encodeURIComponent(apiKey) +
      '&token=' + encodeURIComponent(token) + '&_=' + agora;

    cacheBoard.idBoard = idBoard;
    cacheBoard.timestamp = agora;
    cacheBoard.promise = fetch(url, {
      method: 'GET',
      cache: 'no-store',
      credentials: 'omit',
      headers: { 'Accept': 'application/json' }
    }).then(function (resp) {
      if (!resp.ok) {
        var erro = new Error('REST ' + resp.status);
        erro.status = resp.status;
        throw erro;
      }
      return resp.json();
    }).then(function (cards) {
      var mapa = {};
      (cards || []).forEach(function (card) {
        mapa[card.id] = card.customFieldItems || [];
      });
      cacheBoard.cards = mapa;
      cacheBoard.promise = null;
      cacheBoard.timestamp = Date.now();
      return mapa;
    }).catch(function (erro) {
      cacheBoard.promise = null;
      cacheBoard.cards = null;

      // Token invalido/expirado: remove a autorizacao privada para o Trello
      // voltar a oferecer "Authorize Account" ao membro.
      if (erro && (erro.status === 401 || erro.status === 403)) {
        t.remove('member', 'private', 'trelloReadToken').catch(function () {});
      }
      throw erro;
    });

    return cacheBoard.promise;
  });
}

function carregarItensAtualizados(t) {
  return Promise.all([
    t.card('id'),
    buscarBoardViaRest(t)
  ]).then(function (res) {
    var card = res[0] || {};
    var mapa = res[1];

    if (mapa && card.id && Object.prototype.hasOwnProperty.call(mapa, card.id)) {
      return mapa[card.id];
    }

    // Fallback: preserva o funcionamento para membros ainda nao autorizados
    // ou em caso de falha temporaria da REST API.
    return t.card('customFieldItems').then(function (fallback) {
      return (fallback || {}).customFieldItems || [];
    });
  }).catch(function () {
    return t.card('customFieldItems').then(function (fallback) {
      return (fallback || {}).customFieldItems || [];
    }).catch(function () {
      return [];
    });
  });
}

function carregarCampoAtual(t, definicao) {
  return Promise.all([
    carregarItensAtualizados(t),
    t.get('board', 'shared', 'config')
  ]).then(function (res) {
    return montarCampo(definicao, res[0], res[1]);
  });
}

function criarBadgeFrente(t, definicao) {
  return {
    dynamic: function () {
      return carregarCampoAtual(t, definicao).then(function (campo) {
        if (!campo) return badgeVazio();

        var badge = {
          text: campo.texto,
          refresh: INTERVALO_BADGES
        };
        if (campo.cor) badge.color = campo.cor;
        return badge;
      }).catch(function () {
        return badgeVazio();
      });
    }
  };
}

function criarBadgeDetalhe(t, definicao) {
  return {
    dynamic: function () {
      return carregarCampoAtual(t, definicao).then(function (campo) {
        if (!campo) return badgeVazio();

        var badge = {
          title: campo.nome,
          text: campo.valor,
          refresh: INTERVALO_BADGES
        };
        if (campo.cor) badge.color = campo.cor;
        return badge;
      }).catch(function () {
        return badgeVazio();
      });
    }
  };
}

function carregarDefinicoes(t) {
  return Promise.all([
    t.board('customFields'),
    t.get('board', 'shared', 'config')
  ]).then(function (res) {
    var board = res[0] || {};
    var definicoes = board.customFields || [];
    var config = res[1] || {};

    if (!config.campos) return definicoes;

    return definicoes.filter(function (definicao) {
      var cfg = config.campos[definicao.id];
      return !!(cfg && cfg.on);
    });
  });
}

TrelloPowerUp.initialize({

  'card-badges': function (t) {
    return Promise.all([
      carregarDefinicoes(t),
      t.get('board', 'shared', 'config')
    ]).then(function (res) {
      var definicoes = res[0] || [];
      var config = res[1] || {};
      var badges = definicoes.map(function (definicao) {
        return criarBadgeFrente(t, definicao);
      });

      if (config.mostrarBadgeTeste === true) {
        badges.unshift(criarBadgeDiagnostico());
      }

      return badges;
    }).catch(function () {
      return [];
    });
  },

  'card-detail-badges': function (t) {
    return carregarDefinicoes(t).then(function (definicoes) {
      return definicoes.map(function (definicao) {
        return criarBadgeDetalhe(t, definicao);
      });
    }).catch(function () {
      return [];
    });
  },

  // Faz o Trello oferecer "Authorize Account" enquanto este membro ainda nao
  // tiver concedido leitura REST para o Power-Up.
  'authorization-status': function (t) {
    return Promise.all([
      t.get('board', 'shared', 'trelloApiKey'),
      t.get('member', 'private', 'trelloReadToken')
    ]).then(function (res) {
      return { authorized: !!(res[0] && res[1]) };
    }).catch(function () {
      return { authorized: false };
    });
  },

  'show-authorization': function (t) {
    return t.popup({
      title: 'Autorizar atualização',
      url: t.signUrl('./authorize.html'),
      height: 230
    });
  },

  'show-settings': function (t) {
    return t.popup({
      title: 'Configurar badges',
      url: t.signUrl('./settings.html'),
      height: 220
    });
  }

});
</script>
</body>
</html>
