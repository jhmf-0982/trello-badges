<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autorizar atualização</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    :root,
    html[data-color-mode="light"] {
      color-scheme: light;
      --fundo: #ffffff;
      --texto: #172b4d;
      --suave: #5e6c84;
      --borda: #dfe1e6;
      --campo: #ffffff;
      --azul: #0c66e4;
      --azul-hover: #0055cc;
      --texto-botao: #ffffff;
      --erro: #ae2e24;
      --ok: #216e4e;
    }
    html[data-color-mode="dark"] {
      color-scheme: dark;
      --fundo: #1d2125;
      --texto: #b6c2cf;
      --suave: #9fadbc;
      --borda: #454f59;
      --campo: #22272b;
      --azul: #579dff;
      --azul-hover: #85b8ff;
      --texto-botao: #1d2125;
      --erro: #fd9891;
      --ok: #7ee2b8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--fundo); }
    body {
      font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--texto);
    }
    #root { padding: 12px; }
    p { margin: 0 0 10px; }
    .suave { color: var(--suave); font-size: 12px; }
    .erro { color: var(--erro); }
    .ok { color: var(--ok); }
    label { display: block; font-weight: 600; margin-bottom: 5px; }
    input {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid var(--borda);
      border-radius: 3px;
      background: var(--campo);
      color: var(--texto);
      font: inherit;
      margin-bottom: 8px;
    }
    button {
      border: 0;
      border-radius: 3px;
      padding: 7px 12px;
      background: var(--azul);
      color: var(--texto-botao);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: var(--azul-hover); }
    button:disabled { opacity: .55; cursor: default; }
    #apiBox[hidden], #authBox[hidden] { display: none; }
  </style>
</head>
<body>
<div id="root">
  <div id="apiBox" hidden>
    <label for="apiKey">API key do Power-Up</label>
    <input id="apiKey" type="text" autocomplete="off" spellcheck="false">
    <p class="suave">A API key identifica o Power-Up e pode ser compartilhada. O token pessoal não é armazenado aqui.</p>
    <button id="salvarKey" type="button">Salvar e continuar</button>
  </div>

  <div id="authBox" hidden>
    <p>Autorize o Power-Up a ler os dados atuais do Trello diretamente pela API.</p>
    <p class="suave">A permissão solicitada é somente de leitura.</p>
    <button id="autorizar" type="button">Autorizar minha conta</button>
  </div>

  <p id="status" class="suave">Carregando...</p>
</div>

<script>
var t = TrelloPowerUp.iframe();
var apiKeyAtual = null;

function ajustar() {
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      try { t.sizeTo('#root'); } catch (e) {}
    });
  });
}

function mostrarStatus(texto, classe) {
  var s = document.getElementById('status');
  s.className = classe || 'suave';
  s.textContent = texto || '';
  ajustar();
}

function mostrarFluxo(apiKey, token) {
  apiKeyAtual = apiKey || null;
  document.getElementById('apiBox').hidden = !!apiKeyAtual;
  document.getElementById('authBox').hidden = !apiKeyAtual || !!token;

  if (token) {
    mostrarStatus('Autorização já ativa.', 'ok');
  } else if (apiKeyAtual) {
    mostrarStatus('Autorização necessária.', 'suave');
  } else {
    mostrarStatus('Informe a API key do Power-Up uma única vez.', 'suave');
  }
  ajustar();
}

function urlRetorno() {
  return new URL('./auth-return.html', window.location.href).href;
}

function normalizarToken(token) {
  if (!token) return null;
  token = String(token);
  if (token.charAt(0) === '#') {
    var p = new URLSearchParams(token.slice(1));
    return p.get('token') || null;
  }
  if (token.indexOf('token=') === 0) {
    var p2 = new URLSearchParams(token);
    return p2.get('token') || null;
  }
  return token;
}

document.getElementById('salvarKey').addEventListener('click', function () {
  var input = document.getElementById('apiKey');
  var chave = (input.value || '').trim();
  if (!chave) {
    mostrarStatus('Informe a API key.', 'erro');
    return;
  }

  var botao = this;
  botao.disabled = true;
  mostrarStatus('Salvando...', 'suave');

  t.set('board', 'shared', 'trelloApiKey', chave)
    .then(function () {
      apiKeyAtual = chave;
      mostrarFluxo(chave, null);
    })
    .catch(function (e) {
      mostrarStatus('Erro ao salvar a API key: ' + (e && e.message ? e.message : 'falha desconhecida'), 'erro');
    })
    .then(function () {
      botao.disabled = false;
    });
});

document.getElementById('autorizar').addEventListener('click', function () {
  if (!apiKeyAtual) return;

  var botao = this;
  botao.disabled = true;
  mostrarStatus('Abrindo autorização do Trello...', 'suave');

  var authUrl = 'https://trello.com/1/authorize' +
    '?expiration=never' +
    '&scope=read' +
    '&key=' + encodeURIComponent(apiKeyAtual) +
    '&callback_method=fragment' +
    '&return_url=' + encodeURIComponent(urlRetorno()) +
    '&name=' + encodeURIComponent('Badges Interfood');

  t.authorize(authUrl, { width: 600, height: 700 })
    .then(function (token) {
      token = normalizarToken(token);
      if (!token) throw new Error('Token não recebido.');
      return t.set('member', 'private', 'trelloReadToken', token);
    })
    .then(function () {
      mostrarStatus('Autorizado. Os badges agora leem os valores diretamente da API.', 'ok');
      setTimeout(function () { t.closePopup(); }, 900);
    })
    .catch(function (e) {
      mostrarStatus('Autorização não concluída: ' + (e && e.message ? e.message : 'cancelada'), 'erro');
      botao.disabled = false;
    });
});

Promise.all([
  t.get('board', 'shared', 'trelloApiKey'),
  t.get('member', 'private', 'trelloReadToken')
]).then(function (res) {
  mostrarFluxo(res[0], res[1]);
}).catch(function () {
  mostrarFluxo(null, null);
});

ajustar();
</script>
</body>
</html>
